<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando ao Flow Studio…</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:600px;margin:60px auto;padding:0 20px;text-align:center;color:#1a1a1a}
  code{display:inline-block;margin-top:8px;padding:8px 12px;background:#f0f0f0;border-radius:6px;word-break:break-all}
  button{margin-top:10px;padding:8px 16px;border:0;border-radius:6px;background:#fe2c55;color:#fff;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<h2>Conectando ao Flow Studio…</h2>
<p id="msg">Voltando pro app, aguarde…</p>
<div id="manual" style="display:none">
  <p>Se não voltar sozinho, copie este código e cole no Flow Studio (aba Contas):</p>
  <code id="code"></code><br>
  <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copiar código</button>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code') || '';
  var state = p.get('state') || '';
  var err = p.get('error') || '';
  document.getElementById('code').textContent = code || ('erro: ' + err);
  if (code) {
    // rebota o navegador pro app local (navegação top-level https->localhost é permitida)
    var target = 'http://127.0.0.1:8765/api/tiktok/callback?code=' + encodeURIComponent(code) +
                 '&state=' + encodeURIComponent(state) + '&error=' + encodeURIComponent(err);
    setTimeout(function () { document.getElementById('manual').style.display = 'block'; }, 2500);
    location.replace(target);
  } else {
    document.getElementById('msg').textContent = 'Login não concluído (' + (err || 'sem código') + ').';
    document.getElementById('manual').style.display = 'block';
  }
</script>
</body>
</html>
